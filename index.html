.ba-intro{max-width:70ch}
.ba-msg{min-height:1.5em;max-width:80ch;font-weight:650;margin:.5em 0}
.ba-msg p{margin:.2em 0}
.ba-lines{margin:.3em 0 .3em 1.2em;padding:0;max-width:80ch;overflow-wrap:anywhere}
.ba-tabs{display:flex;flex-wrap:wrap;margin:10px 0 6px}
.ba-tabs .btn{margin:0 8px 8px 0;min-height:44px}
.ba-box{margin:8px 0;min-width:0}
.ba-box h3{margin:1.1em 0 .4em}
.ba-bar{display:flex;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.ba-bar>*{margin:0 10px 8px 0;min-width:0;max-width:100%}
.ba-bar .btn{min-height:44px}
.ba-f{display:flex;flex-direction:column;font-size:.88rem;color:var(--mut);min-width:0;max-width:100%;margin:0 12px 10px 0}
.ba-f>label{font-weight:650;margin-bottom:4px}
.ba-inp{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem;min-height:44px;padding:6px 10px;max-width:100%;min-width:0;box-sizing:border-box}
.ba-inp:hover{border-color:var(--ac)}
.sel.ba-inp{max-width:100%}
textarea.ba-inp{display:block;width:100%;max-width:80ch;line-height:1.45;resize:vertical}
input.ba-inp[type="text"]{width:100%;max-width:30rem}
.ba-num{width:8rem}
.ba-group{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:6px 12px 10px;min-width:0;max-width:80ch}
.ba-group legend{font-weight:650;padding:0 6px}
.ba-check{display:inline-flex;align-items:center;margin:4px 16px 4px 0;min-height:32px;cursor:pointer}
.ba-check input{margin:0 8px 0 0;width:20px;height:20px}
.ba-pool{color:var(--mut);margin:.4em 0 .8em;max-width:80ch}
.ba-meta{color:var(--mut);font-size:.9rem;margin:.2em 0}
.ba-prompt{margin:10px 0;padding:10px 14px;border-left:4px solid var(--ac);background:var(--bg2);max-width:80ch;white-space:pre-wrap;overflow-wrap:anywhere}
.ba-cols{display:flex;flex-wrap:wrap;align-items:stretch}
.ba-answer{flex:1 1 18rem;min-width:0;margin:0 12px 12px 0}
.ba-answer h4{margin:.4em 0}
.ba-anstext{white-space:pre-wrap;overflow-wrap:anywhere;max-height:26rem;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--tx);line-height:1.5}
.ba-anstext:focus{outline:3px solid var(--ac);outline-offset:2px}
.ba-votes .btn{min-height:48px}
.ba-count{color:var(--mut);margin:.4em 0}
.ba-vh{margin:.6em 0 .2em}
.ba-empty{color:var(--mut);max-width:80ch}
.ba-ref{margin:.8em 0;max-width:80ch}
.ba-ref summary{cursor:pointer;font-weight:650;min-height:32px}
.ba-notes{white-space:pre-wrap;overflow-wrap:anywhere}
.ba-src{font-size:.86rem;overflow-wrap:anywhere;margin:.4em 0 .4em 1.2em;padding:0}
.ba-table{margin-top:6px}
.ba-table thead th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.ba-table th[scope="row"]{text-align:left;color:var(--tx);font-size:.93rem;font-weight:650;text-transform:none;letter-spacing:0;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.ba-table td{overflow-wrap:anywhere}
.ba-cap,.ba-offscreen,.ba-file{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ba-filelab{cursor:pointer}
.ba-file:focus+.ba-filelab{outline:3px solid var(--ac);outline-offset:2px}
.ba-file:focus-visible+.ba-filelab{outline:3px solid var(--ac);outline-offset:2px}
.ba-check-out{max-width:80ch;margin:.4em 0}
.ba-custom{list-style:none;margin:8px 0;padding:0;max-width:80ch}
.ba-custom li{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.ba-cid{font-weight:650}
.ba-cprompt{color:var(--mut)}
.ba-custom .btn{min-height:40px;padding:6px 14px;margin:6px 8px 0 0}
.ba-list{max-width:80ch}
.ba-bad{color:#ffb4ab}
:root[data-theme="light"] .ba-bad{color:#8c1d18}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .ba-bad{color:#8c1d18}}
.ba-ok{color:#9be3a8;font-weight:650}
:root[data-theme="light"] .ba-ok{color:#14591f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .ba-ok{color:#14591f}}
.ba-warn{font-weight:650}
@media (max-width:860px){.ba-inp{min-width:80px}.ba-answer{margin-right:0}}

var DATA={"en-translation-0001":{"id":"en-translation-0001","lang":"en","category":"translation","prompt":"Translate into natural Romanian: «It's raining cats and dogs.»","difficulty":"easy","reference_notes":"«Plouă cu găleata.» (also «Toarnă cu găleata», «Plouă torențial»). A literal «Plouă pisici și câini» is wrong."},"en-translation-0002":{"id":"en-translation-0002","lang":"en","category":"translation","prompt":"Translate into Romanian the wish one gives an actor before a show: «Break a leg!»","difficulty":"medium","reference_notes":"In Romanian theatre: «Casă plină!» (also «Mult succes!»). A literal «Rupe-ți un picior!» would sound like a curse."},"en-translation-0003":{"id":"en-translation-0003","lang":"en","category":"translation","prompt":"Translate into Romanian: «Let's call it a day.»","difficulty":"medium","reference_notes":"«Hai să terminăm pentru azi.» or «Hai să ne oprim aici pentru astăzi.» A literal «Hai să-i spunem zi» is wrong."},"en-translation-0004":{"id":"en-translation-0004","lang":"en","category":"translation","prompt":"Translate into Romanian, keeping the informal register: «The old man finally kicked the bucket.»","difficulty":"medium","reference_notes":"«Bătrânul a dat colțul în cele din urmă.» («a da colțul» is the closest colloquial idiom for «to die»; the neutral version is «a murit».)"},"en-translation-0005":{"id":"en-translation-0005","lang":"en","category":"translation","prompt":"Translate into Romanian: «She will eventually call you.» Watch out for false friends.","difficulty":"hard","reference_notes":"«Până la urmă te va suna.» or «În cele din urmă te va suna.» The Romanian «eventual» means «possibly / if the case arises», not «eventually»."},"hu-culture-0001":{"id":"hu-culture-0001","lang":"hu","category":"culture","prompt":"Mikor és hol írták alá a trianoni békeszerződést, és hogyan érintette Magyarország területét?","difficulty":"medium","reference_notes":"1920. június 4-én írták alá Versailles-ban, a Nagy-Trianon kastélyban; Magyarország elvesztette a területének mintegy kétharmadát. A szerződés 1921. július 31-én lépett hatályba.","sources":["https://hu.wikipedia.org/wiki/Trianoni_b%C3%A9ke","https://hu.wikipedia.org/wiki/J%C3%BAnius_4"]},"hu-culture-0002":{"id":"hu-culture-0002","lang":"hu","category":"culture","prompt":"Hol született I. (Hunyadi) Mátyás király, mikor kezdett uralkodni, és mikor koronázták királlyá?","difficulty":"medium","reference_notes":"Kolozsváron született 1443. február 23-án; 1458. január 24-től uralkodott, a koronázására azonban csak 1464. március 29-én került sor Székesfehérvárott. 1490. április 6-án halt meg Bécsben.","sources":["https://hu.wikipedia.org/wiki/I._M%C3%A1ty%C3%A1s_magyar_kir%C3%A1ly","https://hu.wikipedia.org/wiki/M%C3%A1ty%C3%A1s_kir%C3%A1ly_sz%C3%BCl%C5%91h%C3%A1za"]},"hu-grammar-0001":{"id":"hu-grammar-0001","lang":"hu","category":"grammar","prompt":"Mi a különbség a «-ban/-ben» és a «-ba/-be» toldalékok között? Adj két-két példát.","difficulty":"easy","reference_notes":"-ban/-ben: hol? (benne lévő, nyugvó helyzet): «a szobában vagyok», «Kolozsvárott, a házban lakom»; -ba/-be: hová? (irány): «a szobába megyek», «a házba lépek»."},"hu-grammar-0002":{"id":"hu-grammar-0002","lang":"hu","category":"grammar","prompt":"Add meg a -val/-vel ragos alakot: kéz, busz, tanár, ember, könyv.","difficulty":"medium","reference_notes":"kézzel, busszal, tanárral, emberrel, könyvvel (a rag v-je hasonul az előző mássalhangzóhoz)."},"hu-grammar-0003":{"id":"hu-grammar-0003","lang":"hu","category":"grammar","prompt":"Mi a különbség az alanyi és a tárgyas ragozás között? Magyarázd el az «Olvasok egy könyvet.» és az «Olvasom a könyvet.» mondatokkal.","difficulty":"medium","reference_notes":"Alanyi ragozás: a tárgy határozatlan vagy nincs tárgy («Olvasok egy könyvet.»); tárgyas ragozás: a tárgy határozott («Olvasom a könyvet.»)."},"hu-grammar-0004":{"id":"hu-grammar-0004","lang":"hu","category":"grammar","prompt":"Kisbetűvel vagy nagybetűvel írjuk a hónapok, a hét napjai és a nemzetiségek nevét? Adj példákat, és mondd meg, mi a helyzet az országnevekkel.","difficulty":"easy","reference_notes":"Kisbetűvel: január, hétfő, magyar, román. Az országnevek nagybetűvel kezdődnek: Magyarország, Románia."},"hu-reasoning-0001":{"id":"hu-reasoning-0001","lang":"hu","category":"reasoning","prompt":"Egy kosárban 20 alma van. Péter elvesz 5-öt, majd Anna a maradék harmadát. Hány alma marad a kosárban?","difficulty":"easy","reference_notes":"10 alma: 20 − 5 = 15, Anna 15/3 = 5 almát vesz el, marad 15 − 5 = 10."},"hu-reasoning-0002":{"id":"hu-reasoning-0002","lang":"hu","category":"reasoning","prompt":"Egy vonat 14:35-kor indul, és 18:10-kor érkezik. Mennyi ideig utazik?","difficulty":"easy","reference_notes":"3 óra 35 perc."},"hu-reasoning-0003":{"id":"hu-reasoning-0003","lang":"hu","category":"reasoning","prompt":"Péter kétszer annyi idős, mint Anna. Öt év múlva Péter másfélszer lesz olyan idős, mint Anna. Hány évesek most?","difficulty":"medium","reference_notes":"Anna 5 éves, Péter 10 éves: ha Anna a, akkor 2a + 5 = 1,5 · (a + 5), ahonnan a = 5."},"hu-translation-0001":{"id":"hu-translation-0001","lang":"hu","category":"translation","prompt":"Fordítsd le magyarra: «Bună ziua, aș dori să rezerv o masă pentru patru persoane la ora opt seara.»","difficulty":"medium","reference_notes":"«Jó napot kívánok, szeretnék asztalt foglalni négy főre este nyolc órára.» (a «négy személyre» is jó)."},"hu-translation-0002":{"id":"hu-translation-0002","lang":"hu","category":"translation","prompt":"Fordítsd le románra: «Holnap korán kell kelnem, ezért ma korán lefekszem.»","difficulty":"medium","reference_notes":"«Mâine trebuie să mă trezesc devreme, de aceea mă culc devreme azi.»"},"hu-translation-0003":{"id":"hu-translation-0003","lang":"hu","category":"translation","prompt":"Magyarázd el, és fordítsd le románra a következő közmondást: «Nem esik messze az alma a fájától.»","difficulty":"hard","reference_notes":"Jelentése: a gyerek hasonlít a szüleire. Román megfelelője: «Mărul nu cade departe de pom.»"},"ro-culture-0001":{"id":"ro-culture-0001","lang":"ro","category":"culture","prompt":"Cine a fost ales domn al ambelor Principate Române în 1859 și când s-au desfășurat cele două alegeri?","difficulty":"easy","reference_notes":"Alexandru Ioan Cuza, ales domn al Moldovei la 5 ianuarie 1859 (Iași) și al Țării Românești la 24 ianuarie 1859 (București), datele fiind în stil vechi. Până în 1862 cele două state au format o uniune personală; în 1862 s-a format primul guvern comun, cu capitala la București.","sources":["https://ro.wikipedia.org/wiki/Unirea_Principatelor_Rom%C3%A2ne","https://ro.wikipedia.org/wiki/Principatele_Unite_ale_Moldovei_%C8%99i_%C8%9A%C4%83rii_Rom%C3%A2ne%C8%99ti"]},"ro-culture-0002":{"id":"ro-culture-0002","lang":"ro","category":"culture","prompt":"Ce s-a hotărât la Alba Iulia la 1 decembrie 1918 și de ce este această zi Ziua Națională a României?","difficulty":"easy","reference_notes":"Marea Adunare Națională de la Alba Iulia (1228 de delegați) a votat unirea Transilvaniei, Banatului, Crișanei și Maramureșului cu Regatul României. Basarabia se unise cu România în martie 1918, iar Bucovina în noiembrie 1918. 1 Decembrie a fost adoptată ca Ziua Națională prin legea nr. 10 din 31 iulie 1990.","sources":["https://ro.wikipedia.org/wiki/Marea_Adunare_Na%C8%9Bional%C4%83_de_la_Alba_Iulia","https://ro.wikipedia.org/wiki/Unirea_Transilvaniei_cu_Rom%C3%A2nia","https://ro.wikipedia.org/wiki/Ziua_na%C8%9Bional%C4%83_a_Rom%C3%A2niei"]},"ro-culture-0003":{"id":"ro-culture-0003","lang":"ro","category":"culture","prompt":"Ce teritorii enumeră Rezoluția de la Alba Iulia din 1918 și ce drept proclamă «îndeosebi» pentru Banat?","difficulty":"hard","reference_notes":"Articolul I decretează unirea cu România a românilor din Transilvania, Banat și «Țara Ungurească» și a tuturor teritoriilor locuite de ei. Adunarea proclamă în mod special dreptul inalienabil al națiunii române la întreg Banatul cuprins între râurile Mureș, Tisa și Dunăre. Preluarea administrației Banatului a avut loc mai târziu și cu dificultăți, din cauza trupelor sârbe și franceze din regiune.","sources":["https://ro.wikipedia.org/wiki/Declara%C8%9Bia_de_la_Alba_Iulia","https://ro.wikipedia.org/wiki/Unirea_Banatului_cu_Rom%C3%A2nia"]},"ro-culture-0004":{"id":"ro-culture-0004","lang":"ro","category":"culture","prompt":"Când și de către cine a fost proclamată independența României în 1877 și în ce război a fost obținută?","difficulty":"medium","reference_notes":"Independența a fost proclamată în Cameră de Mihail Kogălniceanu la 9 mai 1877 (stil vechi; 21 mai stil nou); unele surse și tradiția sărbătoririi indică 10 mai. A fost obținută în Războiul de Independență (1877–1878), în care armata română a luptat alături de cea rusă împotriva Imperiului Otoman (Grivița, Plevna), și a fost recunoscută internațional în 1878.","sources":["https://ro.wikipedia.org/wiki/R%C4%83zboiul_de_Independen%C8%9B%C4%83_al_Rom%C3%A2niei"]},"ro-culture-0005":{"id":"ro-culture-0005","lang":"ro","category":"culture","prompt":"Ce a realizat Mihai Viteazul în anul 1600 și cum s-a încheiat domnia lui?","difficulty":"medium","reference_notes":"În 1600 a controlat, pentru scurt timp, Țara Românească, Transilvania (după bătălia de la Șelimbăr, 28 octombrie 1599) și Moldova (mai 1600), într-o unire personală efemeră. A fost asasinat la 9 august 1601, la Câmpia Turzii, din ordinul generalului imperial Giorgio Basta.","sources":["https://ro.wikipedia.org/wiki/Mihai_Viteazul","https://ro.wikipedia.org/wiki/Istoria_Transilvaniei"]},"ro-culture-0006":{"id":"ro-culture-0006","lang":"ro","category":"culture","prompt":"Ce s-a întâmplat la Vaslui (Podul Înalt) la 10 ianuarie 1475 și cine era domnul Moldovei?","difficulty":"medium","reference_notes":"Ștefan cel Mare (domn al Moldovei între 1457 și 1504) a învins o mare armată otomană condusă de Hadâm Suleiman Pașa, într-o zonă mlăștinoasă lângă Vaslui, victorie cunoscută ca bătălia de la Podul Înalt.","sources":["https://ro.wikipedia.org/wiki/B%C4%83t%C4%83lia_de_la_Vaslui","https://ro.wikipedia.org/wiki/%C8%98tefan_cel_Mare"]},"ro-culture-0007":{"id":"ro-culture-0007","lang":"ro","category":"culture","prompt":"În ce an a apărut poemul «Luceafărul» de Mihai Eminescu și unde? Care este singurul volum de versuri al lui Eminescu apărut în timpul vieții?","difficulty":"hard","reference_notes":"«Luceafărul» a apărut în 1883, în Almanahul Societății Academice Social-Literare «România Jună» din Viena. Singurul volum tipărit în timpul vieții este «Poesii» (editura Socec, București, cu prefață de Titu Maiorescu), pus în vânzare la 21 decembrie 1883, deși pe copertă figurează anul 1884.","sources":["https://ro.wikipedia.org/wiki/M._Eminescu","https://ro.wikipedia.org/wiki/Rom%C3%A2nia_Jun%C4%83","https://ro.wikipedia.org/wiki/Poesii"]},"ro-culture-0008":{"id":"ro-culture-0008","lang":"ro","category":"culture","prompt":"Care sunt cele două Rapsodii române ale lui George Enescu? Ce alte lucrări sau ipostaze ale compozitorului poți menționa?","difficulty":"medium","reference_notes":"Rapsodia română nr. 1 în La major și nr. 2 în Re major, ambele op. 11 (1901–1902). Enescu (născut în 1881 la Liveni, jud. Botoșani) a fost compozitor, violonist, pianist, dirijor și pedagog; opera «Oedip» este considerată capodopera sa operatică.","sources":["https://ro.wikipedia.org/wiki/Rapsodia_rom%C3%A2n%C4%83","https://ro.wikipedia.org/wiki/Lista_compozi%C8%9Biilor_lui_George_Enescu","https://ro.wikipedia.org/wiki/George_Enescu,_Boto%C8%99ani"]},"ro-culture-0009":{"id":"ro-culture-0009","lang":"ro","category":"culture","prompt":"Cum a început Revoluția din decembrie 1989 și cum s-a încheiat regimul lui Nicolae Ceaușescu?","difficulty":"medium","reference_notes":"A început la Timișoara, la 16 decembrie 1989, în jurul încercării autorităților de a-l evacua pe pastorul reformat László Tőkés. La 22 decembrie Ceaușescu a încercat să fugă, a fost capturat la Târgoviște, iar la 25 decembrie 1989 a fost judecat sumar și executat împreună cu soția sa.","sources":["https://ro.wikipedia.org/wiki/Revolu%C8%9Bia_Rom%C3%A2n%C4%83_din_1989","https://ro.wikipedia.org/wiki/Cronologia_lui_Nicolae_Ceau%C8%99escu"]},"ro-culture-0010":{"id":"ro-culture-0010","lang":"ro","category":"culture","prompt":"Când a aderat România la NATO, la Uniunea Europeană și la spațiul Schengen?","difficulty":"medium","reference_notes":"NATO: 29 martie 2004. Uniunea Europeană: 1 ianuarie 2007 (împreună cu Bulgaria). Schengen: aderare deplină la 1 ianuarie 2025; frontierele aeriene și maritime fuseseră incluse încă din martie 2024.","sources":["https://ro.wikipedia.org/wiki/Rela%C8%9Biile_dintre_Rom%C3%A2nia_%C8%99i_NATO","https://ro.wikipedia.org/wiki/Integrarea_Rom%C3%A2niei_%C3%AEn_Uniunea_European%C4%83","https://ro.wikipedia.org/wiki/Rom%C3%A2nia"]},"ro-culture-0011":{"id":"ro-culture-0011","lang":"ro","category":"culture","prompt":"Este Castelul Bran «castelul lui Dracula»? Ce se știe sigur și ce este legendă?","difficulty":"medium","reference_notes":"Castelul Bran (jud. Brașov) este o fortificație medievală din Transilvania. Legătura cu «Dracula» este în principal turistică și legendară: personajul Contele Dracula este fictiv, creat de Bram Stoker în romanul din 1897, iar asocierea cu Vlad Țepeș (domn al Țării Românești) se bazează în special pe numele «Dracula». Nu există dovezi că Vlad Țepeș a locuit la Bran, iar Stoker nu a vizitat Transilvania.","sources":["https://ro.wikipedia.org/wiki/Comuna_Bran,_Bra%C8%99ov","https://ro.wikipedia.org/wiki/Dracula_(roman)","https://ro.wikipedia.org/wiki/Contele_Dracula"]},"ro-culture-0012":{"id":"ro-culture-0012","lang":"ro","category":"culture","prompt":"Ce fel de limbă este româna și care sunt principalele straturi de influență din vocabularul ei?","difficulty":"easy","reference_notes":"Limbă romanică din ramura orientală, evoluată din latina populară (vulgară); conține un mic substrat traco-dac. Contactul cu populațiile slave din secolul al VI-lea a adus numeroase împrumuturi; ulterior au influențat-o maghiara, greaca, turca, iar în epoca modernă franceza, italiana și, azi, engleza.","sources":["https://ro.wikipedia.org/wiki/Limba_rom%C3%A2n%C4%83","https://ro.wikipedia.org/wiki/Vocabularul_limbii_rom%C3%A2ne"]},"ro-culture-0013":{"id":"ro-culture-0013","lang":"ro","category":"culture","prompt":"Ce este Delta Dunării, unde se află și ce statut internațional are?","difficulty":"easy","reference_notes":"Este delta prin care Dunărea se varsă în Marea Neagră; aproape toată suprafața ei se află în România (jud. Tulcea), iar o parte mică în Ucraina. Este înscrisă din 1991 în Lista patrimoniului mondial UNESCO (sit natural).","sources":["https://whc.unesco.org/en/statesparties/ro/","https://ro.wikipedia.org/wiki/Rom%C3%A2nia"]},"ro-culture-0014":{"id":"ro-culture-0014","lang":"ro","category":"culture","prompt":"Ce sunt «bisericile pictate din nordul Moldovei» incluse în patrimoniul UNESCO? Numește cel puțin patru.","difficulty":"medium","reference_notes":"Un grup de opt biserici din nordul Moldovei (secolele XV–XVI), acoperite pe exterior cu fresce în stil influențat de arta bizantină: Arbore, Humor, Moldovița, Pătrăuți, Probota, Sf. Gheorghe din Suceava, Voroneț (înscrise în 1993) și Sucevița (adăugată în 2010).","sources":["https://whc.unesco.org/en/list/598/","https://whc.unesco.org/en/statesparties/ro/"]},"ro-culture-0015":{"id":"ro-culture-0015","lang":"ro","category":"culture","prompt":"Care sunt siturile din România înscrise în Lista patrimoniului mondial UNESCO în anii 2021 și 2024?","difficulty":"hard","reference_notes":"2021: Peisajul minier Roșia Montană (sit nou) și extinderea siturilor transnaționale «Pădurile primare și străvechi de fagi din Carpați și alte regiuni ale Europei». 2024: Ansamblul monumental Brâncuși de la Târgu Jiu și «Frontierele Imperiului Roman – Dacia».","sources":["https://whc.unesco.org/en/statesparties/ro/"]},"ro-culture-0016":{"id":"ro-culture-0016","lang":"ro","category":"culture","prompt":"Ce este Sighișoara și ce legătură are orașul cu Vlad Țepeș?","difficulty":"medium","reference_notes":"Sighișoara este un oraș medieval fortificat din Transilvania, cu centrul istoric înscris în patrimoniul UNESCO în 1999. Vlad al III-lea Drăculea (Vlad Țepeș), născut în 1431 cel mai probabil aici, a domnit în Țara Românească de trei ori (1448, 1456–1462, 1476) și a murit la 14 decembrie 1476.","sources":["https://whc.unesco.org/en/statesparties/ro/","https://ro.wikipedia.org/wiki/Vlad_%C8%9Aepe%C8%99","https://ro.wikipedia.org/wiki/Transilvania_%C3%AEn_fic%C8%9Biune"]},"ro-culture-0017":{"id":"ro-culture-0017","lang":"ro","category":"culture","prompt":"Din ce piese este alcătuit ansamblul sculptural al lui Constantin Brâncuși de la Târgu Jiu și când a fost inaugurat?","difficulty":"medium","reference_notes":"Masa tăcerii, Aleea scaunelor, Poarta sărutului și Coloana infinitului (Coloana fără sfârșit), așezate pe o axă de aproximativ 1275 m. Lucrările au fost realizate în 1937–1938 și inaugurate la 27 octombrie 1938. Ansamblul a fost înscris în patrimoniul mondial UNESCO în 2024.","sources":["https://ro.wikipedia.org/wiki/Ansamblul_sculptural_Constantin_Br%C3%A2ncu%C8%99i_de_la_T%C3%A2rgu-Jiu","https://whc.unesco.org/en/statesparties/ro/"]},"ro-culture-0018":{"id":"ro-culture-0018","lang":"ro","category":"culture","prompt":"Când a fost proclamat Regatul României și cine a devenit primul rege?","difficulty":"medium","reference_notes":"Regatul României a fost proclamat la 10 mai 1881, iar primul rege a fost Carol I (domnitor al României din 1866, după detronarea lui Cuza).","sources":["https://ro.wikipedia.org/wiki/Regatul_Rom%C3%A2niei","https://ro.wikipedia.org/wiki/Rom%C3%A2nia"]},"ro-culture-0019":{"id":"ro-culture-0019","lang":"ro","category":"culture","prompt":"Unde și când a fost încoronat regele Ferdinand I al României?","difficulty":"hard","reference_notes":"La Alba Iulia, la 15 octombrie 1922, odată cu regina Maria; locul a fost ales pentru valoarea simbolică a Marii Uniri din 1918.","sources":["https://ro.wikipedia.org/wiki/Regatul_Rom%C3%A2niei"]},"ro-culture-0020":{"id":"ro-culture-0020","lang":"ro","category":"culture","prompt":"Ce rol a avut principele Carol I în asediul Plevnei din 1877 și cum s-a încheiat asediul?","difficulty":"medium","reference_notes":"Carol I a primit la 28 august 1877 comanda trupelor ruso-române aliate din fața Plevnei, având ca șef de stat major pe generalul rus Totleben. Asediul a durat până la 10 decembrie 1877, când comandantul otoman Osman Pașa a încercat să iasă din încercuire și a capitulat.","sources":["https://ro.wikipedia.org/wiki/Carol_I_de_Hohenzollern","https://ro.wikipedia.org/wiki/R%C4%83zboiul_de_Independen%C8%9B%C4%83_al_Rom%C3%A2niei"]},"ro-grammar-0001":{"id":"ro-grammar-0001","lang":"ro","category":"grammar","prompt":"Explică diferența dintre «s-au» și «sau» și dă câte două exemple.","difficulty":"easy","reference_notes":"s-au = pronumele reflexiv «se» (elidat) + auxiliarul «au»: «Ei s-au întors devreme.»; sau = conjuncție disjunctivă: «Vii azi sau mâine?». Cratima apare doar la prima formă."},"ro-grammar-0002":{"id":"ro-grammar-0002","lang":"ro","category":"grammar","prompt":"Care este diferența dintre «i-a» și «ia», respectiv «i-au» și «iau»? Dă câte un exemplu pentru fiecare formă.","difficulty":"easy","reference_notes":"i-a / i-au = pronumele «îi» (dativ, elidat) + auxiliarul «a» / «au»: «I-a spus adevărul.», «I-au dat cartea.»; ia = verbul a lua (el/ea ia) sau substantivul «ia» (bluza tradițională); iau = verbul a lua (eu iau, ei iau): «Eu iau autobuzul.»"},"ro-grammar-0003":{"id":"ro-grammar-0003","lang":"ro","category":"grammar","prompt":"Explică diferența dintre «l-a» și «la» și dă câte un exemplu.","difficulty":"easy","reference_notes":"l-a = pronumele «îl» (acuzativ, elidat) + auxiliarul «a»: «L-a văzut ieri.»; la = prepoziție: «Merg la școală.»"},"ro-grammar-0004":{"id":"ro-grammar-0004","lang":"ro","category":"grammar","prompt":"Explică diferența dintre «ne-am» și «neam» și dă câte un exemplu.","difficulty":"easy","reference_notes":"ne-am = pronumele «ne» + auxiliarul «am»: «Ne-am întâlnit la gară.»; neam = substantiv (familie, origine, popor): «E un om de neam bun.»"},"ro-grammar-0005":{"id":"ro-grammar-0005","lang":"ro","category":"grammar","prompt":"Când se scrie «n-ai» și când «nai»? Dar «n-a» și «na»? Dă câte un exemplu.","difficulty":"medium","reference_notes":"n-ai = «nu» (elidat) + «ai»: «N-ai de ce să te temi.»; nai = instrument muzical: «El cântă la nai.»; n-a = «nu» + «a»: «N-a venit nimeni.»; na = interjecție folosită când oferi ceva: «Na, ia-l!»"},"ro-grammar-0006":{"id":"ro-grammar-0006","lang":"ro","category":"grammar","prompt":"Care este diferența dintre «iar» și «i-ar»? Dă câte un exemplu.","difficulty":"easy","reference_notes":"iar = conjuncție adversativă sau adverb (din nou): «Eu citesc, iar tu scrii.», «A plouat iar.»; i-ar = pronumele «îi» (elidat) + auxiliarul condițional «ar»: «I-ar plăcea să vină.»"},"ro-grammar-0007":{"id":"ro-grammar-0007","lang":"ro","category":"grammar","prompt":"Cum se scriu corect: «dintr-un», «dintrun» sau «dintr un»? Dar «într-o»? Explică regula și dă și alte două cuvinte care se scriu la fel.","difficulty":"medium","reference_notes":"Corect: dintr-un, dintr-o, într-un, într-o (prepoziția + articolul nehotărât, legate prin cratimă). Alte cazuri la fel: printr-un, printr-o, dintr-o. Formele fără cratimă sau cu spațiu sunt greșite."},"ro-grammar-0008":{"id":"ro-grammar-0008","lang":"ro","category":"grammar","prompt":"Se scrie «nici un elev» sau «niciun elev»? Cum se scriu corect «nicio problemă» și «niciunul dintre ei»?","difficulty":"medium","reference_notes":"Norma actuală (DOOM) cere scrierea legată: niciun elev, nicio problemă, niciunul dintre ei, niciuna dintre ele."},"ro-grammar-0009":{"id":"ro-grammar-0009","lang":"ro","category":"grammar","prompt":"Care este regula de scriere a literelor «î» și «â» în limba română? Dă exemple și menționează excepțiile.","difficulty":"medium","reference_notes":"î se scrie la începutul și la sfârșitul cuvântului (înainte, a urî, a coborî); â se scrie în interior (câmp, lână, român, România). Excepție: în compuse și derivate cu prefix, î se păstrează în interior (neînțeles, reîncălzi, preîntâmpina). Din 1993 se scrie «sunt» (nu «sînt») și «România», «român» (cu â)."},"ro-grammar-0010":{"id":"ro-grammar-0010","lang":"ro","category":"grammar","prompt":"De ce trebuie să scriem «ș» și «ț» cu virgulă dedesubt, nu cu sedilă (U+015F și U+0163)? Care sunt codurile Unicode corecte pentru literele mici și mari?","difficulty":"easy","reference_notes":"Ortografia românească folosește virgula dedesubt: ș = U+0219, ț = U+021B, Ș = U+0218, Ț = U+021A. Variantele cu sedilă (U+015F, U+0163, U+015E, U+0162) provin din turcă și din vechile codificări; în texte corecte pentru română se evită."},"ro-grammar-0011":{"id":"ro-grammar-0011","lang":"ro","category":"grammar","prompt":"Scrie cu litere și corect gramatical: «12 elevi», «12 eleve», «20 elevi», «22 eleve», «19 elevi», «35 ani».","difficulty":"medium","reference_notes":"doisprezece elevi; douăsprezece eleve; douăzeci de elevi; douăzeci și două de eleve; nouăsprezece elevi; treizeci și cinci de ani. Prepoziția «de» apare de la 20 în sus, dar nu când numeralul se termină în 01–19 (105 elevi → o sută cinci elevi). «Doi» pentru masculin, «două» pentru feminin și neutru."},"ro-grammar-0012":{"id":"ro-grammar-0012","lang":"ro","category":"grammar","prompt":"Completează cu «al», «a», «ai» sau «ale»: «Cartea e ___ mea.», «Prietenii sunt ___ mei.», «Caietele sunt ___ ei.», «Creionul e ___ lui.», «Scaunele sunt ___ noastre.»","difficulty":"medium","reference_notes":"a mea (cartea: feminin singular); ai mei (prietenii: masculin plural); ale ei (caietele: neutru plural, se acordă ca femininul plural); al lui (creionul: masculin singular); ale noastre (scaunele: neutru plural)."},"ro-grammar-0013":{"id":"ro-grammar-0013","lang":"ro","category":"grammar","prompt":"Corectează, dacă este nevoie: «Omul care l-am văzut ieri e vecinul meu.» și «Cartea care am citit-o e interesantă.»","difficulty":"medium","reference_notes":"Complementul direct exprimat prin «care» cere prepoziția «pe» și dublarea prin pronume clitic: «Omul pe care l-am văzut ieri e vecinul meu.»; «Cartea pe care am citit-o e interesantă.»"},"ro-grammar-0014":{"id":"ro-grammar-0014","lang":"ro","category":"grammar","prompt":"Care e forma corectă: «Fiecare dintre elevi au primit o diplomă» sau «Fiecare dintre elevi a primit o diplomă»? Explică.","difficulty":"medium","reference_notes":"«Fiecare» este pronume distributiv la singular, deci predicatul rămâne la singular: «Fiecare dintre elevi a primit o diplomă.»; varianta cu «au primit» este greșită."},"ro-grammar-0015":{"id":"ro-grammar-0015","lang":"ro","category":"grammar","prompt":"Explică diferența dintre «să fie» și «să fi» și dă câte un exemplu.","difficulty":"medium","reference_notes":"să fie = conjunctiv prezent al verbului a fi: «Vreau să fie gata mâine.»; să fi + participiu = conjunctiv perfect, pentru o acțiune anterioară sau nesigură: «Nu cred să fi ajuns deja.»"},"ro-grammar-0016":{"id":"ro-grammar-0016","lang":"ro","category":"grammar","prompt":"Conjugă verbul «a cânta» la perfectul simplu, la toate persoanele.","difficulty":"medium","reference_notes":"eu cântai, tu cântași, el/ea cântă, noi cântarăm, voi cântarăți, ei/ele cântară. Perfectul simplu este curent mai ales în Oltenia și în limba literară; în rest se folosește perfectul compus."},"ro-grammar-0017":{"id":"ro-grammar-0017","lang":"ro","category":"grammar","prompt":"Dă participiul verbelor «a face», «a pune», «a vedea», «a lua», «a spune» și scrie fiecare verb la perfectul compus, persoana I singular.","difficulty":"medium","reference_notes":"făcut (am făcut), pus (am pus), văzut (am văzut), luat (am luat), spus (am spus)."},"ro-grammar-0018":{"id":"ro-grammar-0018","lang":"ro","category":"grammar","prompt":"Ce înseamnă că substantivul «scaun» este neutru? Dă singularul și pluralul pentru: scaun, loc, lucru, creion.","difficulty":"medium","reference_notes":"Neutrele au formă de masculin la singular și de feminin la plural: un scaun – două scaune; un loc – două locuri; un lucru – două lucruri; un creion – două creioane. Numeralul «două» se folosește pentru feminin și neutru."},"ro-grammar-0019":{"id":"ro-grammar-0019","lang":"ro","category":"grammar","prompt":"Care este diferența dintre «copii» și «copiii», respectiv «fii» și «fiii»? Mai dă două perechi asemănătoare.","difficulty":"hard","reference_notes":"copii = plural nearticulat («mulți copii»); copiii = plural articulat hotărât («copiii din clasă»). La fel: fii / fiii; ochi / ochii; pui / puii."},"ro-grammar-0020":{"id":"ro-grammar-0020","lang":"ro","category":"grammar","prompt":"Desparte în silabe cuvintele: «România», «copil», «pădure», «înțelege», «sâmbătă».","difficulty":"medium","reference_notes":"Ro-mâ-ni-a, co-pil, pă-du-re, în-ți-le-ge, sâm-bă-tă."},"ro-grammar-0021":{"id":"ro-grammar-0021","lang":"ro","category":"grammar","prompt":"Cum se scriu ghilimelele în limba română? Dă un exemplu de citat în interiorul altui citat.","difficulty":"easy","reference_notes":"Ghilimelele românești sunt „ ” (deschidere jos, închidere sus), iar citatul din interior se pune între « »: „Mama a spus: «Vino acasă!»”."},"ro-grammar-0022":{"id":"ro-grammar-0022","lang":"ro","category":"grammar","prompt":"Se scriu cu majusculă lunile anului, zilele săptămânii și numele sărbătorilor religioase? Dă exemple.","difficulty":"medium","reference_notes":"Lunile și zilele se scriu cu literă mică (ianuarie, luni). Numele sărbătorilor religioase se scriu cu majusculă (Crăciun, Paști, Bobotează)."},"ro-grammar-0023":{"id":"ro-grammar-0023","lang":"ro","category":"grammar","prompt":"Pune virgulele în propoziția: «Ioane vino încoace dar nu face zgomot» și explică de ce.","difficulty":"medium","reference_notes":"Ioane, vino încoace, dar nu face zgomot. Virgula desparte vocativul («Ioane») și precede conjuncția adversativă «dar»."},"ro-grammar-0024":{"id":"ro-grammar-0024","lang":"ro","category":"grammar","prompt":"Dă vocativul pentru: Ion, domn, doamnă, băiat, frate, Andrei.","difficulty":"medium","reference_notes":"Ioane, domnule, doamnă, băiete, frate, Andrei (unele forme coincid cu nominativul)."},"ro-grammar-0025":{"id":"ro-grammar-0025","lang":"ro","category":"grammar","prompt":"Explică diferența dintre «dumneata» și «dumneavoastră».","difficulty":"easy","reference_notes":"dumneata = pronume de politețe pentru o singură persoană, cu nivel mediu de respect, cu verbul la persoana a II-a singular («dumneata ai spus»); dumneavoastră = politețe înaltă, pentru una sau mai multe persoane, cu verbul la persoana a II-a plural («dumneavoastră ați spus»)."},"ro-grammar-0026":{"id":"ro-grammar-0026","lang":"ro","category":"grammar","prompt":"Când se folosește «mai bun» și când «mai bine»? Dă câte două exemple.","difficulty":"medium","reference_notes":"mai bun = comparativ al adjectivului «bun», se acordă: «un plan mai bun», «o idee mai bună»; mai bine = comparativul adverbului «bine», nu se acordă: «Ea cântă mai bine decât mine.»"},"ro-grammar-0027":{"id":"ro-grammar-0027","lang":"ro","category":"grammar","prompt":"Pune cratimele și diacriticele corecte în: «dami l», «ia o», «spunemi le».","difficulty":"medium","reference_notes":"dă-mi-l, ia-o, spune-mi-le. Cratima leagă verbul de pronumele clitice; pronumele în dativ (mi) precede pe cel în acuzativ (l, o, le)."},"ro-grammar-0028":{"id":"ro-grammar-0028","lang":"ro","category":"grammar","prompt":"Care este diferența dintre «decât» și «de cât»? Dă exemple pentru fiecare.","difficulty":"medium","reference_notes":"decât = adverb/conjuncție în comparații și restricții: «E mai înalt decât mine.», «N-am decât zece lei.»; de cât = prepoziția «de» + «cât» interogativ sau relativ: «De cât timp ai nevoie?»"},"ro-grammar-0029":{"id":"ro-grammar-0029","lang":"ro","category":"grammar","prompt":"Care dintre expresiile «de asemenea», «deasupra», «dedesubt», «de aceea» se scriu legat și care separat?","difficulty":"medium","reference_notes":"Se scriu legat: deasupra, dedesubt. Se scriu separat: de asemenea, de aceea."},"ro-grammar-0030":{"id":"ro-grammar-0030","lang":"ro","category":"grammar","prompt":"Scrie pluralul substantivelor: cal, ou, nume, frate, floare, ochi.","difficulty":"medium","reference_notes":"cai, ouă, nume, frați, flori, ochi. (Cu articol hotărât: caii, ouăle, numele, frații, florile, ochii.)"},"ro-reasoning-0001":{"id":"ro-reasoning-0001","lang":"ro","category":"reasoning","prompt":"Un fermier are 17 oi. Toate, în afară de 9, mor. Câte oi îi rămân?","difficulty":"easy","reference_notes":"9. «Toate în afară de 9» înseamnă că 9 nu mor."},"ro-reasoning-0002":{"id":"ro-reasoning-0002","lang":"ro","category":"reasoning","prompt":"Dacă 5 mașini fac 5 piese în 5 minute, în cât timp fac 100 de mașini 100 de piese?","difficulty":"medium","reference_notes":"5 minute: fiecare mașină face o piesă în 5 minute, deci 100 de mașini fac 100 de piese în 5 minute."},"ro-reasoning-0003":{"id":"ro-reasoning-0003","lang":"ro","category":"reasoning","prompt":"Un caiet și un pix costă împreună 11 lei. Caietul costă cu 10 lei mai mult decât pixul. Cât costă pixul?","difficulty":"medium","reference_notes":"0,50 lei (caietul costă 10,50 lei). Nu 1 leu: atunci caietul ar costa 11 lei și suma ar fi 12 lei."},"ro-reasoning-0004":{"id":"ro-reasoning-0004","lang":"ro","category":"reasoning","prompt":"Într-un lac, o plantă acoperă în fiecare zi o suprafață de două ori mai mare decât în ziua precedentă. Dacă lacul este acoperit complet în 48 de zile, în câte zile este acoperit pe jumătate?","difficulty":"easy","reference_notes":"47 de zile: în ultima zi suprafața se dublează de la jumătate la întreg."},"ro-reasoning-0005":{"id":"ro-reasoning-0005","lang":"ro","category":"reasoning","prompt":"Ana are acum de două ori vârsta pe care o avea Bogdan atunci când Ana avea vârsta pe care o are Bogdan acum. Împreună au acum 63 de ani. Câți ani are fiecare?","difficulty":"hard","reference_notes":"Ana 36 de ani, Bogdan 27. Verificare: acum 9 ani Ana avea 27 de ani (vârsta actuală a lui Bogdan), iar Bogdan avea 18; 36 = 2 · 18. Din condiții: 3A = 4B și A + B = 63."},"ro-reasoning-0006":{"id":"ro-reasoning-0006","lang":"ro","category":"reasoning","prompt":"Un tren pornește din orașul A spre orașul B cu 60 km/h, iar în același moment un alt tren pornește din B spre A cu 90 km/h. Distanța dintre orașe este 450 km. Peste cât timp se întâlnesc și la ce distanță de A?","difficulty":"medium","reference_notes":"Viteza de apropiere este 150 km/h, deci se întâlnesc peste 3 ore, la 180 km de A (și 270 km de B)."},"ro-reasoning-0007":{"id":"ro-reasoning-0007","lang":"ro","category":"reasoning","prompt":"Un drum se parcurge dus cu 60 km/h și întors, pe același traseu, cu 40 km/h. Care este viteza medie pe întreg parcursul?","difficulty":"medium","reference_notes":"48 km/h (media armonică 2·60·40/(60+40)), nu 50 km/h: pe traseul mai lent se petrece mai mult timp."},"ro-reasoning-0008":{"id":"ro-reasoning-0008","lang":"ro","category":"reasoning","prompt":"Un preț crește cu 20%, apoi scade cu 20%. Cum se compară prețul final cu cel inițial?","difficulty":"easy","reference_notes":"Prețul final este 0,96 din cel inițial, adică cu 4% mai mic (1,2 · 0,8 = 0,96)."},"ro-reasoning-0009":{"id":"ro-reasoning-0009","lang":"ro","category":"reasoning","prompt":"Pe o insulă, cavalerii spun mereu adevărul, iar mincinoșii mint mereu. Ion spune: «Eu și Vasile suntem amândoi mincinoși». Ce sunt Ion și Vasile?","difficulty":"medium","reference_notes":"Ion este mincinos și Vasile este cavaler. Dacă Ion ar spune adevărul, ar fi mincinos, contradicție. Deci Ion minte, iar enunțul lui e fals: nu sunt amândoi mincinoși; cum Ion este mincinos, Vasile e cavaler."},"ro-reasoning-0010":{"id":"ro-reasoning-0010","lang":"ro","category":"reasoning","prompt":"Câte numere de trei cifre distincte se pot forma cu cifrele 1, 2, 3, 4, 5 și câte dintre ele sunt pare?","difficulty":"medium","reference_notes":"60 de numere (5 · 4 · 3) și 24 dintre ele sunt pare: ultima cifră poate fi 2 sau 4 (2 variante), apoi 4 · 3 = 12 variante pentru primele două cifre, deci 2 · 12 = 24."},"ro-reasoning-0011":{"id":"ro-reasoning-0011","lang":"ro","category":"reasoning","prompt":"Se aruncă două zaruri corecte. Care este probabilitatea ca suma punctelor să fie 8?","difficulty":"medium","reference_notes":"5/36 ≈ 13,9%: perechile favorabile sunt (2,6), (3,5), (4,4), (5,3), (6,2), din 36 de rezultate posibile."},"ro-reasoning-0012":{"id":"ro-reasoning-0012","lang":"ro","category":"reasoning","prompt":"Dacă azi este miercuri, ce zi a săptămânii va fi peste 100 de zile?","difficulty":"easy","reference_notes":"Vineri: 100 = 14 · 7 + 2, deci peste 100 de zile trec 2 zile în plus față de miercuri."},"ro-reasoning-0013":{"id":"ro-reasoning-0013","lang":"ro","category":"reasoning","prompt":"Un robinet umple un bazin în 6 ore, altul în 3 ore, iar un scurgător îl golește în 12 ore. Dacă toate trei sunt deschise simultan, în cât timp se umple bazinul gol?","difficulty":"medium","reference_notes":"În 2 ore și 24 de minute: debitul total este 1/6 + 1/3 − 1/12 = 5/12 din bazin pe oră, deci 12/5 ore = 2,4 ore."},"ro-reasoning-0014":{"id":"ro-reasoning-0014","lang":"ro","category":"reasoning","prompt":"Trei cutii conțin: mere, portocale, respectiv mere și portocale amestecate. Toate cele trei etichete («mere», «portocale», «mere și portocale») sunt greșite. Poți scoate un singur fruct dintr-o singură cutie, fără să te uiți înăuntru. Din ce cutie scoți fructul și cum afli conținutul tuturor cutiilor?","difficulty":"medium","reference_notes":"Se alege cutia etichetată «mere și portocale»: eticheta e greșită, deci conține un singur fel de fruct. Dacă scoți un măr, cutia e cea cu mere; atunci cutia etichetată «portocale» nu poate fi nici cu portocale, nici cu mere, deci conține amestecul, iar cutia etichetată «mere» conține portocale. Simetric dacă scoți o portocală."},"ro-reasoning-0015":{"id":"ro-reasoning-0015","lang":"ro","category":"reasoning","prompt":"Patru persoane trebuie să treacă noaptea un pod cu o singură lanternă; pe pod pot merge cel mult două persoane odată, iar perechea merge cu viteza celei mai lente. Ele au nevoie de 1, 2, 5 și 10 minute. Care este timpul minim în care trec toate?","difficulty":"hard","reference_notes":"17 minute: (1 și 2) trec, 2 min; 1 se întoarce, 1 min; (5 și 10) trec, 10 min; 2 se întoarce, 2 min; (1 și 2) trec, 2 min."},"ro-reasoning-0016":{"id":"ro-reasoning-0016","lang":"ro","category":"reasoning","prompt":"La o întâlnire sunt 12 persoane și fiecare dă mâna o singură dată cu fiecare dintre celelalte. Câte strângeri de mână au loc?","difficulty":"easy","reference_notes":"66 (12 · 11 / 2)."},"ro-reasoning-0017":{"id":"ro-reasoning-0017","lang":"ro","category":"reasoning","prompt":"Un tren pleacă la 22:45 și ajunge a doua zi la 06:20. Cât durează călătoria?","difficulty":"easy","reference_notes":"7 ore și 35 de minute (1 h 15 min până la miezul nopții + 6 h 20 min)."},"ro-reasoning-0018":{"id":"ro-reasoning-0018","lang":"ro","category":"reasoning","prompt":"Depui 1000 de lei la o dobândă de 5% pe an, compusă anual. Câți lei ai în cont după 3 ani?","difficulty":"medium","reference_notes":"1157,63 lei (1000 · 1,05³ = 1157,625)."},"ro-reasoning-0019":{"id":"ro-reasoning-0019","lang":"ro","category":"reasoning","prompt":"Câte litere «p» are cuvântul «paralelipiped»?","difficulty":"easy","reference_notes":"3 (p-a-r-a-l-e-l-i-p-i-p-e-d: pozițiile 1, 9 și 11)."},"ro-reasoning-0020":{"id":"ro-reasoning-0020","lang":"ro","category":"reasoning","prompt":"Ana este mai înaltă decât Bogdan, Bogdan este mai înalt decât Cristina, iar Dan este mai scund decât Cristina. Cine este cel mai înalt și cine este cel mai scund?","difficulty":"easy","reference_notes":"Cea mai înaltă este Ana, iar cel mai scund este Dan (ordinea: Ana > Bogdan > Cristina > Dan)."},"ro-translation-0001":{"id":"ro-translation-0001","lang":"ro","category":"translation","prompt":"Traduce în engleză, păstrând sensul expresiei: «Nu mai bate câmpii și spune-mi direct ce s-a întâmplat!»","difficulty":"medium","reference_notes":"«A bate câmpii» = a vorbi fără rost, a divaga. Traduceri firești: «Stop beating around the bush and tell me straight what happened!» sau «Stop rambling and tell me directly what happened!». O traducere literală («beat the fields») este greșită."},"ro-translation-0002":{"id":"ro-translation-0002","lang":"ro","category":"translation","prompt":"Traduce în engleză: «Pentru nunta fiicei sale, s-a făcut luntre și punte ca totul să iasă perfect.»","difficulty":"medium","reference_notes":"«A se face luntre și punte» = a depune toate eforturile. Traduceri firești: «For his daughter's wedding he bent over backwards to make everything perfect», «moved heaven and earth». O traducere literală («made himself boat and bridge») este greșită."},"ro-translation-0003":{"id":"ro-translation-0003","lang":"ro","category":"translation","prompt":"Traduce în engleză: «Mi-ai luat vorba din gură.»","difficulty":"easy","reference_notes":"«You took the words right out of my mouth.»"},"ro-translation-0004":{"id":"ro-translation-0004","lang":"ro","category":"translation","prompt":"Traduce în engleză proverbul: «Cine sapă groapa altuia cade singur în ea.»","difficulty":"medium","reference_notes":"«Whoever digs a pit for others will fall into it himself.» (sau «He who digs a pit for another falls into it himself.»)"},"ro-translation-0005":{"id":"ro-translation-0005","lang":"ro","category":"translation","prompt":"Traduce în engleză: «Colegul meu este un om foarte sensibil, așa că ai grijă ce-i spui.»","difficulty":"hard","reference_notes":"«My colleague is a very sensitive person, so be careful what you say to him.» Atenție la falsul prieten: «sensibil» = «sensitive», nu «sensible» (care înseamnă «rezonabil»)."}};

// Elo secvențial în ordinea voturilor (K=32, start 1000, remiza = 0,5); «bad» nu se numără

      const x = models[i], y = models[j];
      if (typeof ans[x] !== 'string' || !ans[x].trim() || typeof ans[y] !== 'string' || !ans[y].trim()) continue;
      const lo = x < y ? x : y, hi = x < y ? y : x;

// JSON Lines: {"prompt": "...", "model": "...", "answer": "..."}; coduri de eroare: json, object, prompt, model, answer, long
function parseAnswers(text) {

    if (!s || s.charAt(0) === '#') continue;

    if (!isObj(o)) { errors.push({ line: i + 1, error: 'object' }); continue; }
    if (typeof o.prompt !== 'string' || !/^[A-Za-z0-9._:-]{1,80}$/.test(o.prompt)) { errors.push({ line: i + 1, error: 'prompt' }); continue; }
    if (!checkModelName(o.model)) { errors.push({ line: i + 1, error: 'model' }); continue; }
    if (typeof o.answer !== 'string' || !o.answer.trim()) { errors.push({ line: i + 1, error: 'answer' }); continue; }
    if (o.answer.length > LIMITS.answer) { errors.push({ line: i + 1, error: 'long' }); continue; }
    items.push({ prompt: o.prompt, model: o.model, answer: o.answer });
  }

}

  return new RegExp('(^|[^A-Za-z0-9\\u00C0-\\u024F])(' + list.join('|') + ')(?![A-Za-z0-9\\u00C0-\\u024F])', 'gi');
}
// înlocuiește numele modelelor din sesiune și numele cunoscute cu «[model]»; întoarce {text, count}
function anonymise(text, names) {
  const re = nameRe((names || []).concat(KNOWN_NAMES));
  let count = 0;
  if (!re) return { text: String(text), count: 0 };
  const out = String(text).replace(re, function (m, pre) { count++; return pre + '[model]'; });
  return { text: out, count: count };

// numere de telefon românești (mobil 07…, fix 02…/03…) cu orice separatori; naționale (10 cifre) sau internaționale (+40 / 0040)

  const m = t.match(/(?:\+|\b00)?\d[\d\s.()\/-]{6,20}\d/g) || [];

    const groups = c.replace(/^\+/, '').split(/\D+/).filter(Boolean);
    for (let i = 0; i < groups.length; i++) {
      let d = '';
      for (let j = i; j < groups.length && d.length < 13; j++) {

        if (intl && i === 0) { const r = d.replace(/^(?:00)?40/, ''); if (r !== d && (/^[237]\d{8}$/.test(r) || /^0[237]\d{8}$/.test(r))) return true; }
